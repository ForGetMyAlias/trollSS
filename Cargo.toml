[package]
name = "trollss"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only Linux screenshare scanner for Minecraft"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.191"
memchr = "2.8.3"
object = "0.40.0"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
